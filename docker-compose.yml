services:
  app:
    image: ${IMAGE_NAME:-sports-analytics-coursework:24}
    container_name: ${APP_CONTAINER_NAME:-sports_analytics_app}
    build:
      context: .
      dockerfile: src/SportsAnalyticsWeb/Dockerfile
    restart: unless-stopped
    ports:
      - "${EXTERNAL_PORT:-8024}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/data/sports_analytics.db
      Prediction__BookmakerMarginPercent: ${MARGIN_PERCENT:-7}
    volumes:
      - sports_analytics_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  sports_analytics_data:
